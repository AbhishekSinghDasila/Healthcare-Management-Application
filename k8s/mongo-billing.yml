apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-billing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo-billing
  template:
    metadata:
      labels:
        app: mongo-billing
    spec:
      containers:
        - name: mongo-billing
          image: mongo:7
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-billing-storage
              mountPath: /data/db
      volumes:
        - name: mongo-billing-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-billing
spec:
  selector:
    app: mongo-billing
  ports:
    - port: 27017
      targetPort: 27017
