apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      containers:
        - name: analytics-service
          image: analytics-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3005
          env:
            - name: PORT
              value: "3005"
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:3001"
            - name: PATIENT_SERVICE_URL
              value: "http://patient-service:3002"
            - name: APPOINTMENT_SERVICE_URL
              value: "http://appointment-service:3003"
            - name: BILLING_SERVICE_URL
              value: "http://billing-service:3004"
            - name: DOCTOR_SERVICE_URL
              value: "http://doctor-service:3006"
          readinessProbe:
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
spec:
  selector:
    app: analytics-service
  type: NodePort
  ports:
    - port: 3005
      targetPort: 3005
      nodePort: 30005
